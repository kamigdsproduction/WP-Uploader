<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPress Email Auto-Publisher</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Quill.js WYSIWYG Editor CDN -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        .ql-editor {
            min-height: 280px;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <!-- Header -->
        <div class="border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-800">WordPress Email Publisher</h1>
            <p class="text-xs text-slate-500 mt-1">Kirim artikel ke WordPress cukup dengan sekali klik via Email (Bypass REST API & Firewall).</p>
        </div>
        
        <!-- Form Email Target -->
        <div class="mb-6 p-4 bg-blue-50 rounded-lg border border-blue-100">
            <label class="block text-xs font-semibold text-blue-800 uppercase mb-1">Email Tujuan WordPress (Alamat Email Postie)</label>
            <input id="targetEmail" type="email" placeholder="contoh: artikel-rahasia@domainanda.com" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
            <p class="text-[11px] text-blue-600 mt-1">*Masukkan alamat email penerima yang sudah Anda hubungkan dengan plugin Postie di WordPress.</p>
        </div>

        <!-- Form Konten Artikel -->
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Judul Artikel</label>
                <input id="postTitle" type="text" placeholder="Masukkan judul artikel..." class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- WYSIWYG Editor Container -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Isi Artikel</label>
                <div id="quillEditor" class="bg-white rounded-b-lg"></div>
            </div>

            <!-- Action Bar -->
            <div class="flex items-center justify-between pt-4 border-t">
                <div class="text-xs text-slate-500">
                    Sistem akan membuka aplikasi email dengan draft artikel yang sudah siap kirim.
                </div>

                <button onclick="sendViaEmail()" id="btnSubmit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors shadow-md hover:shadow-lg flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    Kirim Artikel via Email
                </button>
            </div>
        </div>

        <!-- Status Area -->
        <div id="logArea" class="mt-6 hidden p-4 rounded-lg text-sm"></div>

    </div>

    <script>
        // Inisialisasi WYSIWYG Editor
        const quill = new Quill('#quillEditor', {
            theme: 'snow',
            placeholder: 'Tuliskan artikel Anda di sini...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'align': [] }],
                    ['link', 'blockquote'],
                    ['clean']
                ]
            }
        });

        function sendViaEmail() {
            const targetEmail = document.getElementById('targetEmail').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const log = document.getElementById('logArea');

            // Ambil konten HTML dari Quill
            const contentHtml = quill.root.innerHTML;

            if (!targetEmail || !title) {
                alert("Harap isi Email Tujuan dan Judul Artikel!");
                return;
            }

            log.classList.remove('hidden', 'bg-red-50');
            log.classList.add('bg-green-50', 'text-green-800');
            log.innerHTML = "<strong>Membuka Aplikasi Email...</strong><br>Silakan periksa jendela aplikasi email Anda (Gmail/Outlook), lalu klik <strong>Send / Kirim</strong>.";

            // Format body mailto (encode uri agar karakter khusus HTML tidak merusak URL)
            const subjectEncoded = encodeURIComponent(title);
            const bodyEncoded = encodeURIComponent(contentHtml);

            // Buka Mailto Link
            const mailtoUrl = `mailto:${targetEmail}?subject=${subjectEncoded}&body=${bodyEncoded}`;
            
            // Eksekusi pembukaan email
            window.location.href = mailtoUrl;
        }
    </script>
</body>
</html>
