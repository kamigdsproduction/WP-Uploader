<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordPress Publisher dengan Quill.js WYSIWYG</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 1. Quill.js CSS & JS CDN -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        /* Mengatur tinggi minimal area editor Quill */
        .ql-editor {
            min-height: 250px;
            font-size: 16px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-6">WordPress Publisher (WYSIWYG)</h1>
        
        <!-- Form Kredensial -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 bg-slate-50 rounded-lg border border-slate-200">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">URL WordPress</label>
                <input id="wpUrl" type="url" placeholder="https://domainanda.com" class="w-full p-2 border rounded text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input id="wpUser" type="text" placeholder="admin" class="w-full p-2 border rounded text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Application Password</label>
                <input id="wpPass" type="password" placeholder="xxxx xxxx xxxx xxxx" class="w-full p-2 border rounded text-sm">
            </div>
        </div>

        <!-- Form Konten -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Judul Artikel</label>
                <input id="postTitle" type="text" placeholder="Masukkan judul..." class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Gambar Utama (Featured Image)</label>
                <input id="postImage" type="file" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <!-- 2. Container Quill.js menggantikan textarea -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Isi Artikel</label>
                <div id="quillEditor" class="bg-white rounded-b-lg"></div>
            </div>

            <div class="flex items-center justify-between pt-4">
                <select id="postStatus" class="p-2 border rounded-lg text-sm bg-white">
                    <option value="publish">Langsung Tayang (Publish)</option>
                    <option value="draft">Simpan Draf (Draft)</option>
                </select>

                <button onclick="publishToWordPress()" id="btnSubmit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors">
                    Upload ke WordPress
                </button>
            </div>
        </div>

        <!-- Status & Log -->
        <div id="logArea" class="mt-6 hidden p-4 rounded-lg text-sm"></div>
    </div>

    <script>
        // 3. Inisialisasi Quill.js dengan Toolbar Lengkap
        const quill = new Quill('#quillEditor', {
            theme: 'snow',
            placeholder: 'Tuliskan artikel Anda di sini...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],        // Format Teks
                    [{ 'color': [] }, { 'background': [] }],          // Warna Teks
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],     // List
                    [{ 'align': [] }],                               // Rata Teks
                    ['link', 'blockquote', 'code-block'],             // Media & Block
                    ['clean']                                         // Hapus Formatting
                ]
            }
        });

        async function publishToWordPress() {
            const url = document.getElementById('wpUrl').value.replace(/\/$/, "");
            const user = document.getElementById('wpUser').value;
            const pass = document.getElementById('wpPass').value;
            const title = document.getElementById('postTitle').value;
            const imageFile = document.getElementById('postImage').files[0];
            const status = document.getElementById('postStatus').value;
            const log = document.getElementById('logArea');

            // 4. Mengambil hasil formatted HTML dari Quill.js
            const contentHtml = quill.root.innerHTML;

            if (!url || !user || !pass || !title) {
                alert("Harap isi URL, Username, Password, dan Judul Artikel!");
                return;
            }

            log.classList.remove('hidden', 'bg-red-50', 'bg-green-50', 'text-red-700', 'text-green-700');
            log.classList.add('bg-blue-50', 'text-blue-700');
            log.innerText = "Memproses pengiriman...";

            const authHeader = 'Basic ' + btoa(user + ':' + pass);
            let mediaId = null;

            try {
                // Step 1: Upload Featured Image (jika ada)
                if (imageFile) {
                    log.innerText = "Mengunggah gambar ke WordPress...";
                    const formData = new FormData();
                    formData.append('file', imageFile);

                    const imgRes = await fetch(`${url}/wp-json/wp/v2/media`, {
                        method: 'POST',
                        headers: { 'Authorization': authHeader },
                        body: formData
                    });

                    if (!imgRes.ok) throw new Error("Gagal mengunggah gambar. Periksa kredensial / CORS.");
                    const imgData = await imgRes.json();
                    mediaId = imgData.id;
                }

                // Step 2: Publish Artikel dengan Konten HTML Quill.js
                log.innerText = "Memuat postingan ke WordPress...";
                const postPayload = {
                    title: title,
                    content: contentHtml, // Dikirim dalam format HTML murni
                    status: status,
                    featured_media: mediaId
                };

                const postRes = await fetch(`${url}/wp-json/wp/v2/posts`, {
                    method: 'POST',
                    headers: {
                        'Authorization': authHeader,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(postPayload)
                });

                if (!postRes.ok) throw new Error("Gagal menerbitkan artikel.");
                const postData = await postRes.json();

                log.classList.remove('bg-blue-50', 'text-blue-700');
                log.classList.add('bg-green-50', 'text-green-700');
                log.innerHTML = `<strong>Berhasil!</strong> Artikel telah menerbitkan.<br><a href="${postData.link}" target="_blank" class="underline">Lihat Artikel (${postData.link})</a>`;

            } catch (err) {
                log.classList.remove('bg-blue-50', 'text-blue-700');
                log.classList.add('bg-red-50', 'text-red-700');
                log.innerText = "Terjadi Kesalahan: " + err.message;
            }
        }
    </script>
</body>
</html>
